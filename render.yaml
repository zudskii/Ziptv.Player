# Render Blueprint: one web service (API + client, same origin) built from the Dockerfile.
# PostgreSQL: create a Render Postgres (or any managed Postgres) and paste its connection
# string as DATABASE_URL in the Render dashboard (use ?sslmode=require if the host demands TLS).
services:
  - type: web
    name: ziptv
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STREAM_TOKEN_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Render's proxy is one hop; use 2 if Cloudflare proxies in front of Render.
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
