# Local / self-hosted stack: PostgreSQL + ZIPTV (API and client on one origin).
#   cp .env.example .env                 # set POSTGRES_PASSWORD, STREAM_TOKEN_SECRET, DATA_ENCRYPTION_KEY
#   docker compose up -d --build         # → http://localhost:8080
#   docker compose run --rm tools npm test
# Backup:  docker compose exec postgres pg_dump -U ziptv ziptv > ziptv-$(date +%F).sql
# Restore: docker compose exec -T postgres psql -U ziptv ziptv < ziptv-YYYY-MM-DD.sql
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziptv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ziptv
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Only on this machine's loopback: lets you inspect data with psql/DBeaver/pgAdmin.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ziptv -d ziptv']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ziptv:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ziptv:${POSTGRES_PASSWORD}@postgres:5432/ziptv
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:?Set STREAM_TOKEN_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # true only for a home server whose playlists point to LAN addresses (e.g. TVHeadend).
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Email (password reset, address confirmation). All three or none; see the README.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # all = API + jobs in one process; api when the worker profile runs the jobs.
      ROLE: ${ROLE:-all}
      STREAM_DELIVERY: ${STREAM_DELIVERY:-auto}
      PLAYLIST_EXPORT_MODE: ${PLAYLIST_EXPORT_MODE:-}
      # Needed once more than one app instance runs (`--profile redis` starts the bundled one).
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - '${PORT:-8080}:8080'
      # Operator console: loopback only by default — reach it through SSH/VPN, never the open internet.
      - '${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8081}:8081'
    # Live streams get time to finish during `docker compose down` / redeploys.
    stop_grace_period: 20s

  # Background jobs in their own process (scale API and workers separately):
  #   docker compose --profile worker up -d   and set ROLE=api on the app service.
  worker:
    profiles: ['worker']
    image: ziptv:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ROLE: worker
      DATABASE_URL: postgres://ziptv:${POSTGRES_PASSWORD}@postgres:5432/ziptv
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:?Set STREAM_TOKEN_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-false}
      REDIS_URL: ${REDIS_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    stop_grace_period: 20s

  # Shared state for multiple app instances. Start with: docker compose --profile redis up -d
  # and set REDIS_URL=redis://redis:6379/0 in .env.
  redis:
    profiles: ['redis']
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'volatile-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off tasks (tests, migrations) with dev dependencies and sources — never runs by itself.
  #   docker compose run --rm tools npm test
  #   docker compose run --rm tools npm run migrate -w @ziptv/server
  tools:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    image: ziptv:tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ziptv:${POSTGRES_PASSWORD}@postgres:5432/ziptv
      LOG_LEVEL: warn
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:?Set STREAM_TOKEN_SECRET in .env}
      # Tests create and drop their own throw-away databases on this server.
      TEST_DATABASE_URL: postgres://ziptv:${POSTGRES_PASSWORD}@postgres:5432/postgres

volumes:
  pg-data:
